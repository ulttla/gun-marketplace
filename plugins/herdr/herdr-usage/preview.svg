<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>herdr-usage synthetic preview, English interface (made-up numbers)</title>
  <rect width="1000" height="470" fill="#16171b"/>
  <!-- detail popup -->
  <g transform="translate(330,24)">
    <rect width="420" height="370" rx="12" fill="#202228" stroke="#34363e"/>
